<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Friend Form')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar('friends')}"></div>

<main class="page-container narrow-page">
    <div class="page-header">
        <div>
            <p class="eyebrow">Friend information</p>
            <h1 th:text="${friendDTO.id == null ? 'Add Friend' : 'Edit Friend'}">Friend Form</h1>
        </div>
        <a class="button secondary" th:href="@{/friends}">Back to List</a>
    </div>

    <form class="form-card" method="post" th:action="@{/friends/save}" th:object="${friendDTO}">
        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <label>Friend Name</label>
            <input type="text" th:field="*{name}" minlength="2" maxlength="80" required placeholder="Enter friend name">
            <span class="error-message" th:errors="*{name}"></span>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" th:field="*{phone}" minlength="7" maxlength="20" pattern="[+0-9()\- ]+" required placeholder="Enter phone number">
                <span class="error-message" th:errors="*{phone}"></span>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{email}" maxlength="120" placeholder="Enter email address">
                <span class="error-message" th:errors="*{email}"></span>
            </div>
        </div>

        <div class="form-group">
            <label>Address</label>
            <input type="text" th:field="*{address.fullAddress}" maxlength="200" placeholder="Enter address">
            <span class="error-message" th:errors="*{address.fullAddress}"></span>
        </div>

        <div class="form-group">
            <label>Notes</label>
            <textarea th:field="*{notes}" rows="4" maxlength="1000" placeholder="Write a short note"></textarea>
            <span class="error-message" th:errors="*{notes}"></span>
        </div>

        <div class="form-actions">
            <button class="button primary" type="submit">Save Friend</button>
            <a class="button secondary" th:href="@{/friends}">Cancel</a>
        </div>
    </form>
</main>
<div th:replace="~{fragments/layout :: confirmModal}"></div>
</body>
</html>
