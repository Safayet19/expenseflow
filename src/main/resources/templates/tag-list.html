<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tags')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar('tags')}"></div>

<main class="page-container">
    <div class="page-header">
        <div>
            <p class="eyebrow">Loan organization</p>
            <h1>Tags</h1>
        </div>
        <a class="button primary" th:href="@{/tags/new}">Add Tag</a>
    </div>

    <div class="table-card">
        <div class="table-responsive">
            <table>
                <thead>
                <tr>
                    <th>No.</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="tag, stat : ${tags}">
                    <td class="row-number" th:text="${stat.count}"></td>
                    <td><span class="tag-badge" th:text="${tag.name}"></span></td>
                    <td class="table-note" th:text="${tag.description != null && !tag.description.isEmpty() ? tag.description : '-'}"></td>
                    <td>
                        <div class="action-links">
                            <a class="action-link edit" th:href="@{/tags/edit/{id}(id=${tag.id})}">Edit</a>
                            <form class="inline-action-form" method="post" th:action="@{/tags/delete/{id}(id=${tag.id})}">
                                <button class="action-link delete" type="button" data-delete-trigger data-delete-entity="tag" th:attr="data-delete-name=${tag.name}">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(tags)}">
                    <td class="empty-state" colspan="4">No tags found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: confirmModal}"></div>
</body>
</html>
