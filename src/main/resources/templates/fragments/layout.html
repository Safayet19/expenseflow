<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle + ' | Friend Loan Tracker'}">Friend Loan Tracker</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<nav class="navbar" th:fragment="navbar(activePage)">
    <div class="nav-inner">
        <a class="brand" th:href="@{/}" aria-label="Friend Loan Tracker home">
            <span class="brand-mark">FL</span>
            <span class="brand-copy">
                <strong>Friend Loan</strong>
                <small>Tracker</small>
            </span>
        </a>

        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="mainNavigation" data-nav-toggle>
            <span aria-hidden="true">☰</span>
            <span class="sr-only">Toggle navigation</span>
        </button>

        <div class="nav-links" id="mainNavigation" data-nav-menu>
            <a th:classappend="${activePage == 'friends'} ? ' active' : ''" th:href="@{/friends}">Friends</a>
            <a th:classappend="${activePage == 'loans'} ? ' active' : ''" th:href="@{/loans}">Loans</a>
            <a th:classappend="${activePage == 'reminders'} ? ' active' : ''" th:href="@{/reminders}">Reminders</a>
            <a th:classappend="${activePage == 'contacts'} ? ' active' : ''" th:href="@{/contacts}">Contacts</a>
            <a th:classappend="${activePage == 'tags'} ? ' active' : ''" th:href="@{/tags}">Tags</a>
            <a th:classappend="${activePage == 'activities'} ? ' active' : ''" th:href="@{/activities}">Activities</a>
        </div>
    </div>
</nav>

<div class="modal-backdrop" id="confirmModal" th:fragment="confirmModal" hidden>
    <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMessage">
        <div class="confirm-icon" aria-hidden="true">!</div>
        <div>
            <h2 id="confirmTitle">Delete this record?</h2>
            <p id="confirmMessage">This action cannot be undone.</p>
        </div>
        <div class="confirm-actions">
            <button class="button secondary" type="button" data-confirm-cancel>Cancel</button>
            <a class="button danger solid" href="#" data-confirm-action>Delete</a>
        </div>
    </div>
</div>
</body>
</html>
