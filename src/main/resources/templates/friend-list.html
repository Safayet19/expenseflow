<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Friends')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar('friends')}"></div>

<main class="page-container">
    <div class="page-header">
        <div>
            <p class="eyebrow">Friend management</p>
            <h1>Friend List</h1>
        </div>
        <a class="button primary" th:href="@{/friends/new}">Add New Friend</a>
    </div>

    <div class="table-card">
        <div class="table-responsive">
            <table>
                <thead>
                <tr>
                    <th>No.</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Address</th>
                    <th>Loans</th>
                    <th>Notes</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="friend, stat : ${friends}">
                    <td class="row-number" th:text="${stat.count}"></td>
                    <td>
                        <div class="person-cell">
                            <span class="person-avatar" th:text="${#strings.substring(friend.name, 0, 1)}">F</span>
                            <span class="person-name" th:text="${friend.name}"></span>
                        </div>
                    </td>
                    <td th:text="${friend.phone}"></td>
                    <td th:text="${friend.email != null && !friend.email.isEmpty() ? friend.email : '-'}"></td>
                    <td th:text="${friend.address != null && friend.address.fullAddress != null && !friend.address.fullAddress.isEmpty() ? friend.address.fullAddress : '-'}"></td>
                    <td><span class="loan-count" th:text="${#lists.size(friend.loans)}"></span></td>
                    <td class="table-note" th:text="${friend.notes != null && !friend.notes.isEmpty() ? friend.notes : '-'}"></td>
                    <td>
                        <div class="action-links">
                            <a class="action-link edit" th:href="@{/friends/edit/{id}(id=${friend.id})}">Edit</a>
                            <form class="inline-action-form" method="post" th:action="@{/friends/delete/{id}(id=${friend.id})}">
                                <button class="action-link delete" type="button" data-delete-trigger data-delete-entity="friend" th:attr="data-delete-name=${friend.name}">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(friends)}">
                    <td class="empty-state" colspan="8">No friends found. Add your first friend.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: confirmModal}"></div>
</body>
</html>
